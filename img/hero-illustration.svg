<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <style>
    .primary { fill: #2A64BC; }
    .secondary { fill: #f0f0f0; }
    .accent { fill: #333; }
  </style>
  <g>
    <!-- Background -->
    <rect x="0" y="0" width="400" height="300" fill="#ffffff" />
    
    <!-- School Building -->
    <rect x="50" y="100" width="150" height="120" class="secondary" />
    <rect x="80" y="140" width="30" height="40" class="primary" />
    <rect x="140" y="140" width="30" height="40" class="primary" />
    <rect x="100" y="200" width="50" height="20" class="primary" />
    <polygon points="50,100 125,50 200,100" class="primary" />
    
    <!-- Students with Products -->
    <circle cx="280" cy="120" r="25" class="primary" /> <!-- Head -->
    <rect x="270" y="145" width="20" height="40" class="accent" /> <!-- Body -->
    <rect x="250" y="155" width="20" height="10" class="accent" /> <!-- Arm -->
    <rect x="290" y="155" width="20" height="10" class="accent" /> <!-- Arm -->
    
    <!-- Product Box -->
    <rect x="310" y="150" width="40" height="30" class="secondary" />
    <line x1="310" y1="160" x2="350" y2="160" stroke="#333" stroke-width="2" />
    <line x1="330" y1="150" x2="330" y2="180" stroke="#333" stroke-width="2" />
    
    <!-- Second Student -->
    <circle cx="340" cy="200" r="20" class="primary" /> <!-- Head -->
    <rect x="330" y="220" width="20" height="30" class="accent" /> <!-- Body -->
    
    <!-- Shopping Bag -->
    <path d="M320,230 L310,250 L330,250 Z" class="secondary" />
    <line x1="315" y1="230" x2="315" y2="250" stroke="#333" stroke-width="2" />
    <line x1="325" y1="230" x2="325" y2="250" stroke="#333" stroke-width="2" />
  </g>
</svg>